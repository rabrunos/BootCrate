name: BootCrate self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootcrate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install isolated validation dependencies
        run: |
          python -m pip install --only-binary=:all: -r docs/.human/bootstrap/validation/requirements.txt
      - name: Validate template and intake
        run: |
          git show --format= --check HEAD
          python docs/.human/bootstrap/validation/validate.py
      - name: Scan history for secrets with a checksum-verified scanner
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/bootcrate-gitleaks"
          mkdir -p "$destination"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$destination/scanner.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$destination/scanner.tar.gz" | sha256sum --check --status
          tar -xzf "$destination/scanner.tar.gz" -C "$destination" gitleaks
          "$destination/gitleaks" git --redact --no-banner --log-opts=--all --timeout=180 .
