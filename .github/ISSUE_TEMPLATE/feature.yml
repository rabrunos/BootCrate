name: "Feature"
description: "New user/product capability."
title: "[Feature] "
labels: ["type:feature"]
body:
  - type: textarea
    id: outcome
    attributes: {label: Desired outcome}
    validations: {required: true}
  - type: textarea
    id: decisions
    attributes: {label: Owner decisions / UX rules}
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations: {required: true}
  - type: textarea
    id: non_goals
    attributes: {label: Non-goals}
  - type: input
    id: related
    attributes: {label: Related Epic / Milestone / Issues}
