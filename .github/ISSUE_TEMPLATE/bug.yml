name: "Bug"
description: "Unexpected or incorrect behavior."
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes: {label: Observed behavior}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction / conditions}
  - type: textarea
    id: environment
    attributes: {label: Version / environment}
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "Prefer sanitized/structured evidence. Never include secrets/private raw data."
  - type: textarea
    id: acceptance
    attributes:
      label: Fix acceptance
      placeholder: "- [ ] ..."
