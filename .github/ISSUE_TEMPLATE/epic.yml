name: "Epic"
description: "Large coordinated product/technical outcome."
title: "[Epic] "
labels: ["type:epic"]
body:
  - type: textarea
    id: outcome
    attributes: {label: Outcome}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: Scope}
    validations: {required: true}
  - type: textarea
    id: non_goals
    attributes: {label: Non-goals}
  - type: textarea
    id: acceptance
    attributes:
      label: Epic acceptance criteria
      placeholder: "- [ ] ..."
    validations: {required: true}
  - type: textarea
    id: children
    attributes:
      label: Child work
      description: "Link Features/Tasks/Bugs/Investigations as they are created."
