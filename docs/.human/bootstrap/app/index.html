<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>BootCrate Setup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>BootCrate</strong>
      <span id="subtitle">Setup</span>
    </div>
    <div class="topActions">
      <span id="saveStatus" class="saveStatus" role="status" aria-live="polite">Saved</span>
      <button id="langBtn" class="quietButton" type="button">PT-BR</button>
      <label class="quietButton fileButton">Import JSON<input id="importInput" type="file" accept=".json,application/json"></label>
      <button id="newBtn" class="quietButton" type="button">New</button>
    </div>
  </header>

  <main class="shell">
    <aside class="sidebar" aria-label="Setup navigation">
      <div class="progressCard">
        <div class="progressRow"><strong id="progressText">0 / 0</strong><span id="progressPercent">0%</span></div>
        <div class="progressTrack" role="progressbar" aria-label="Setup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="barFill"></div></div>
        <p id="requiredText"></p>
      </div>
      <nav id="sectionNav" class="sectionNav"></nav>
      <p id="privacyHint" class="privacyHint">Your answers stay in this browser until you export them.</p>
    </aside>

    <section class="workspace" aria-live="polite">
      <div id="stepHeader" class="stepHeader"></div>
      <div id="formRoot"></div>
      <div id="inlineMessage" class="inlineMessage" role="status" aria-live="polite"></div>
      <div class="stepActions">
        <button id="backBtn" class="secondaryButton" type="button">Back</button>
        <button id="nextBtn" class="primaryButton" type="button">Continue</button>
      </div>
    </section>
  </main>

  <dialog id="resetDialog">
    <form method="dialog" class="dialogCard">
      <h2 id="resetTitle">Start over?</h2>
      <p id="resetText">This clears the local draft in this browser.</p>
      <div class="dialogActions">
        <button id="cancelResetBtn" value="cancel" class="secondaryButton">Cancel</button>
        <button id="confirmResetBtn" value="confirm" class="dangerButton">Start new</button>
      </div>
    </form>
  </dialog>

  <script src="questions.js"></script>
  <script src="intake-core.js"></script>
  <script src="setup-handoff.js"></script>
  <script src="app.js"></script>
</body>
</html>
